# =============================================================================
# RPLidar driver parameters — Foxbot 2WD
# =============================================================================
#
# These parameters are loaded by the rplidar_composition node.
# The frame_id MUST match the URDF link name ("laser") so that
# robot_state_publisher's TF and the LaserScan messages are consistent.
#
# Serial port:
#   - RPLidar typically appears as /dev/ttyUSB0 on Linux
#   - Create a udev rule for /dev/rplidar if the port number varies
#
# Baud rate:
#   - RPLidar A1: 115200
#   - RPLidar A2: 115200 (some models: 256000)
#   - RPLidar A3/S1: 256000
# =============================================================================

rplidar_composition:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    serial_baudrate: 115200
    frame_id: laser
    inverted: false
    angle_compensate: true
    scan_mode: ''
